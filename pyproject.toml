[project]
name = "pbi-report-agent"
version = "0.1.0"
description = "A Deep Agent that authors and publishes Power BI reports from natural language."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Fnu Satvik" }]
dependencies = [
    "deepagents>=0.1.0",
    "langchain>=0.3.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
# Anthropic model backend for the `chat` agent. Swap for langchain-openai if preferred.
anthropic = ["langchain-anthropic>=0.3.0"]

[project.scripts]
pbi-report-agent = "pbi_report_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pbi_report_agent"]
